{% extends "base.html" %}

{% block content %}
<!-- 
    Main layout:
    - Left column: form to add a new library
    - Right column: list of already monitored libraries
-->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

    <!-- ========================= -->
    <!-- New Library creation form -->
    <!-- ========================= -->
    <section class="lg:col-span-1 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-2xl">
        <!-- Section title -->
        <h2 class="text-xl font-bold mb-6 text-amber-400 flex items-center">
            <span class="mr-2">📚</span> New Library
        </h2>

        <!-- 
            Form used to create a new monitored library.
            Submits data via POST to /libraries.
        -->
        <form action="/libraries" method="POST" class="space-y-4">

            <!-- Library display name -->
            <div>
                <label class="block font-semibold mb-1 text-slate-300">
                    Library Name
                </label>
                <input
                    type="text"
                    name="name"
                    placeholder="e.g. Movies 1080p"
                    required
                    class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:border-amber-500 outline-none"
                >
            </div>

            <!-- Path where media files are stored -->
            <div>
                <label class="block font-semibold mb-1 text-blue-300">
                    Media Path
                </label>
                <div class="flex gap-2">
                    <input
                        type="text"
                        id="media-path-input"
                        name="media_path"
                        placeholder="/media"
                        required
                        readonly
                        class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:border-blue-500 outline-none cursor-pointer"
                    >
                
                    <button
                        type="button"
                        id="media-path-browse"
                        class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded"
                        title="Browse media folders"
                    >
                        Browse
                    </button>
                </div>
            </div>

            <!-- Temporary working directory for processing -->
            <div>
                <label class="block font-semibold mb-1 text-orange-300">
                    Temp Path
                </label>
                <div class="flex gap-2">
                    <input
                        type="text"
                        id="temp-path-input"
                        name="temp_path"
                        placeholder="/temp"
                        required
                        readonly
                        class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:border-orange-500 outline-none cursor-pointer"
                    >
                
                    <button
                        type="button"
                        id="temp-path-browse"
                        class="px-3 py-2 bg-orange-600 hover:bg-orange-700 text-white text-sm rounded"
                        title="Browse temp folders"
                    >
                        Browse
                    </button>
                </div>
            </div>

            <!-- Conversion profile selection -->
            <div>
                <label class="block font-semibold mb-1 text-green-300">
                    Conversion Profile
                </label>
                <select
                    name="profile_id"
                    required
                    class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:border-green-500 outline-none"
                >
                    <!-- Profiles provided by the backend -->
                    {% for profile in profiles %}
                        <option value="{{ profile.id }}">
                            {{ profile.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Submit button -->
            <button
                type="submit"
                class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-lg mt-4 transition-all transform active:scale-95"
            >
                ➕ Add Library
            </button>
        </form>
    </section>

    <!-- ========================= -->
    <!-- Monitored libraries list  -->
    <!-- ========================= -->
    <section class="lg:col-span-2 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-2xl">
        <!-- Section title -->
        <h2 class="text-xl font-bold mb-6 text-slate-300">
            Monitored Libraries
        </h2>

        <!-- Container for library cards -->
        <div class="space-y-4">
            {% for lib in libraries %}
                <!-- Single library card -->
                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 flex justify-between items-center shadow-inner">

                    <!-- Library information -->
                    <div>
                        <h3 class="font-bold text-amber-400">
                            {{ lib.name }}
                        </h3>
                        <p class="text-xs text-slate-500 mt-1 italic">
                            {{ lib.media_path }}
                        </p>
                    </div>

                    <!-- Library actions -->
                    <div class="flex items-center gap-4">
                        <!-- Assigned conversion profile -->
                        <span class="text-xs bg-slate-800 px-2 py-1 rounded border border-slate-600 text-slate-300">
                            Profile: {{ lib.profile.name }}
                        </span>
                        
                        <!-- Library actions -->
                        <div class="flex items-center gap-2">
                          <!-- Enqueue library -->
                          <button
                            class="library-action bg-green-600 hover:bg-green-700 text-white text-xs px-2 py-1 rounded"
                            data-library-id="{{ lib.id }}"
                            data-library-name="{{ lib.name }}"
                            data-action="enqueue"
                            title="Queue all pending files in this library"
                          >
                            ▶️
                          </button>
                        
                          <!-- Dequeue library -->
                          <button
                            class="library-action bg-red-600 hover:bg-red-700 text-white text-xs px-2 py-1 rounded"
                            data-library-id="{{ lib.id }}"
                            data-library-name="{{ lib.name }}"
                            data-action="dequeue"
                            title="Remove all queued files from this library"
                          >
                            ⏹
                          </button>
                        
                          <!-- Rescan library -->
                          <button
                            class="library-action bg-amber-500 hover:bg-amber-600 text-slate-900 text-xs px-2 py-1 rounded"
                            data-library-id="{{ lib.id }}"
                            data-library-name="{{ lib.name }}"
                            data-action="rescan"
                            title="Re-scan all completed files in this library"
                          >
                            🔄
                          </button>
                        </div>
                        
                        <!-- Delete library form -->
                        <form
                            action="/libraries/{{ lib.id }}/delete"
                            method="POST"
                            onsubmit="return confirm('Are you sure you want to delete this library?');"
                        >
                            <button
                                type="submit"
                                class="text-red-500 hover:text-red-400 transition-colors p-1"
                                title="Delete Library"
                            >
                                <!-- Trash icon (SVG) -->
                                <svg xmlns="http://www.w3.org/2000/svg"
                                     class="h-5 w-5"
                                     fill="none"
                                     viewBox="0 0 24 24"
                                     stroke="currentColor">
                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                          stroke-width="2"
                                          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </form>
                    </div>
                </div>

            {% else %}
                <!-- Empty state when no libraries exist -->
                <p class="text-slate-500 italic text-center py-10">
                    No libraries added yet.
                </p>
            {% endfor %}
        </div>
    </section>
</div>

<!-- Library action confirmation modal -->
<div id="library-action-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60">
  <div class="bg-slate-900 border border-slate-700 rounded-xl p-6 max-w-md w-full shadow-2xl">
    <h3 class="text-lg font-bold text-slate-100 mb-4">
      Confirm action
    </h3>

    <p id="library-action-message" class="text-sm text-slate-400 mb-6">
      <!-- This text will be injected dynamically -->
    </p>

    <div class="flex justify-end gap-3">
      <button
        id="library-action-cancel"
        class="px-4 py-2 text-sm rounded bg-slate-700 hover:bg-slate-600 text-slate-200"
      >
        No
      </button>

      <button
        id="library-action-confirm"
        class="px-4 py-2 text-sm rounded bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold"
      >
        Yes
      </button>
    </div>
  </div>
</div>

<!-- Folder Browser Modal -->
<div
  id="folder-browser-modal"
  class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60"
>
  <div class="bg-slate-900 border border-slate-700 rounded-xl p-6 max-w-lg w-full shadow-2xl">
    <h3
      id="folder-browser-title"
      class="text-lg font-bold text-slate-100 mb-4"
    >
      Select Folder
    </h3>

    <!-- Current path -->
    <p
      id="folder-browser-path"
      class="text-xs text-slate-400 mb-3 break-all"
    ></p>

    <!-- Folder list -->
    <div
      id="folder-browser-list"
      class="border border-slate-700 rounded bg-slate-800 max-h-64 overflow-y-auto"
    >
      <!-- Folders injected by JS -->
    </div>

    <!-- Actions -->
    <div class="flex justify-between items-center mt-4">
      <button
        id="folder-browser-up"
        class="px-3 py-2 text-sm rounded bg-slate-700 hover:bg-slate-600 text-slate-200"
      >
        ⬅ Back
      </button>

      <div class="flex gap-3">
        <button
          id="folder-browser-cancel"
          class="px-4 py-2 text-sm rounded bg-slate-700 hover:bg-slate-600 text-slate-200"
        >
          Cancel
        </button>

        <button
          id="folder-browser-select"
          class="px-4 py-2 text-sm rounded bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold"
          disabled
        >
          Select
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  /**
   * Library bulk actions handler
   * - Fetches preview count
   * - Shows confirmation modal
   * - Executes action only if confirmed
   */

  document.addEventListener("DOMContentLoaded", () => {
    const modal = document.getElementById("library-action-modal");
    const messageEl = document.getElementById("library-action-message");
    const confirmBtn = document.getElementById("library-action-confirm");
    const cancelBtn = document.getElementById("library-action-cancel");

    let pendingAction = null;

    // Utility: open modal
    function openModal() {
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    // Utility: close modal
    function closeModal() {
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      pendingAction = null;
    }

    // Attach click handler to all library action buttons
    document.querySelectorAll(".library-action").forEach((button) => {
      button.addEventListener("click", async () => {
        const libraryId = button.dataset.libraryId;
        const libraryName = button.dataset.libraryName;
        const action = button.dataset.action;

        try {
          // 1. Fetch preview (affected files count)
          const previewResponse = await fetch(
            `/libraries/${libraryId}/${action}/preview`
          );
          const data = await previewResponse.json();
          const count = data.affected_files || 0;

          // 2. Build message depending on action
          let actionText = "";
          if (action === "enqueue") {
            actionText = `queue ${count} files`;
          } else if (action === "dequeue") {
            actionText = `remove ${count} files from the queue`;
          } else if (action === "rescan") {
            actionText = `re-scan ${count} files`;
          }

          // 3. Case: no files affected
          if (count === 0) {
            messageEl.textContent =
              `There are no files to process for this action in library "${libraryName}".`;

            // Hide "Yes" button, change "No" to "Close"
            confirmBtn.classList.add("hidden");
            cancelBtn.textContent = "Close";

            openModal();
            return;
          }

          // 4. Normal confirmation flow
          messageEl.innerHTML =
            `This action will <strong>${actionText}</strong> ` +
            `from library <strong>"${libraryName}"</strong>.<br><br>` +
            `Do you want to continue?`;

          confirmBtn.classList.remove("hidden");
          cancelBtn.textContent = "No";

          // Store pending action
          pendingAction = {
            libraryId,
            action,
          };

          openModal();
        } catch (err) {
          console.error("Preview request failed:", err);
        }
      });
    });

    // Confirm action
    confirmBtn.addEventListener("click", async () => {
      if (!pendingAction) return;

      const { libraryId, action } = pendingAction;

      try {
        await fetch(`/libraries/${libraryId}/${action}`, {
          method: "POST",
        });

        // Backend redirects, but fetch does not follow location
        // We manually reload the current page
        window.location.reload();
      } catch (err) {
        console.error("Action request failed:", err);
      }
    });

    // Cancel / Close modal
    cancelBtn.addEventListener("click", closeModal);

    // Close modal if user clicks outside content
    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });
  });
  
    //
    // Folder browser logic (Media Path & Temp Path)
    //
    
    (() => {
      const modal = document.getElementById("folder-browser-modal");
      const titleEl = document.getElementById("folder-browser-title");
      const pathEl = document.getElementById("folder-browser-path");
      const listEl = document.getElementById("folder-browser-list");
      const backBtn = document.getElementById("folder-browser-up");
      const cancelBtn = document.getElementById("folder-browser-cancel");
      const selectBtn = document.getElementById("folder-browser-select");
    
      const mediaInput = document.getElementById("media-path-input");
      const tempInput = document.getElementById("temp-path-input");
    
      let currentBase = null;   // "media" | "temp"
      let currentPath = null;
      let selectedPath = null;
    
      function openModal(base) {
        currentBase = base;
        selectedPath = null;
        selectBtn.disabled = true;
    
        titleEl.textContent =
          base === "media" ? "Select Media Folder" : "Select Temp Folder";
    
        loadPath(null);
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      }
    
      function closeModal() {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      }
    
      async function loadPath(path) {
        const params = path ? `?path=${encodeURIComponent(path)}` : "";
        const response = await fetch(`/api/browse/${currentBase}${params}`);
        const data = await response.json();
    
        currentPath = data.current_path;
        pathEl.textContent = currentPath;
        selectedPath = currentPath;
        selectBtn.disabled = false;
    
        listEl.innerHTML = "";
    
        data.directories.forEach((dir) => {
          const item = document.createElement("div");
          item.textContent = dir.name;
          item.className =
            "px-3 py-2 cursor-pointer hover:bg-slate-700 text-slate-200";
    
          item.addEventListener("click", () => {
            loadPath(dir.path);
          });
    
          listEl.appendChild(item);
        });
    
        backBtn.disabled =
          currentPath === (currentBase === "media" ? "/media" : "/temp");
      }
    
      // Attach browse buttons
      document
        .getElementById("media-path-browse")
        .addEventListener("click", () => openModal("media"));
    
      document
        .getElementById("temp-path-browse")
        .addEventListener("click", () => openModal("temp"));
    
      // Back button
      backBtn.addEventListener("click", () => {
        if (!currentPath) return;
        const parent = currentPath.split("/").slice(0, -1).join("/") || "/";
        loadPath(parent);
      });
    
      // Select button
      selectBtn.addEventListener("click", () => {
        if (currentBase === "media") {
          mediaInput.value = selectedPath;
        } else {
          tempInput.value = selectedPath;
        }
        closeModal();
      });
    
      // Cancel
      cancelBtn.addEventListener("click", closeModal);
    
      // Click outside modal closes it
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
    })();

</script>

{% endblock %}
