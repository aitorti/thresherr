{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl">
  <div class="text-xs text-slate-500 font-semibold mb-1">Settings</div>
  <h1 class="text-2xl font-extrabold text-slate-100 mb-4">General</h1>

  <form method="post" action="/settings"
        class="rounded-lg border border-slate-700 bg-slate-900 p-5 space-y-4">
    <div>
      <label for="log_level" class="block text-sm font-bold text-slate-200 mb-1">Log level</label>
      <p class="text-xs text-slate-500 mb-2">
        Changes are applied immediately — no restart needed. Debug and Trace files are
        always written regardless of this setting.
      </p>
      <select id="log_level" name="log_level"
              class="px-3 py-2 rounded-md bg-slate-800 border border-slate-700 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
        <option value="info" {% if log_level == 'info' %}selected{% endif %}>Info</option>
        <option value="debug" {% if log_level == 'debug' %}selected{% endif %}>Debug</option>
        <option value="trace" {% if log_level == 'trace' %}selected{% endif %}>Trace</option>
      </select>
    </div>

    <button type="submit"
            class="px-4 py-2 rounded-md bg-amber-600 text-sm text-slate-950 font-bold hover:bg-amber-500 transition-colors">
      Save
    </button>
  </form>

  <p class="text-xs text-slate-500 mt-3">
    Log files are stored in <span class="font-mono text-slate-400">{{ log_dir }}</span> —
    view them under <a href="/system/logfiles" class="text-amber-400 hover:underline font-semibold">System → Log Files</a>.
  </p>
</div>
{% endblock %}
