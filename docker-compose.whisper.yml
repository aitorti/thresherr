# Servicio Whisper opcional (Language auto-detect, último recurso para pistas 'und').
#
# Uso: levanta thresherr con detección de idioma por audio incluida:
#     docker compose -f docker-compose.yml -f docker-compose.whisper.yml up -d
#
# La app lo descubre automáticamente en http://whisper:8000/v1 (misma red
# del proyecto). Si no lo levantas, el botón "Language auto-detect" del
# modal mostrará un aviso — el resto de thresherr funciona igual.
#
# Si ya tienes un servicio Whisper (p. ej. en otro host), puedes apuntar
# Settings -> General -> Whisper base URL a tu servidor y no usar este
# compose.

services:
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: thresherr-whisper
    volumes:
      - whisper-models:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  whisper-models:
