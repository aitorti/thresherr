# ─────────────────────────────────────────────────────────────
# Thresherr — docker-compose del TALLER de desarrollo (/git).
# Contenedores dev (thresherr-dev-app / thresherr-dev-worker, puerto
# 8506) con --reload activo para iterar rápido. Monta la zona de
# pruebas (/multimedia), NO la biblioteca real.
# Para una instalación estable/producción usa una copia propia (ver
# /docker/thresherr en la máquina de Aitor) con tus rutas reales.
# GPU: el backend se elige en docker-compose.override.yml
# (hwaccel.transcoding.yml: cpu | nvenc | vaapi | qsv).
# ─────────────────────────────────────────────────────────────
name: thresherr-dev

services:
  app:
    build: .
    container_name: thresherr-dev-app
    ports:
      - "8506:8000"
    volumes:
      - ./app:/app
      - ./data:/data
#      - /mnt/:/media
      - /multimedia:/media
      - /temp:/temp
    restart: unless-stopped

  worker:
    build: .
    container_name: thresherr-dev-worker
    command: ["python", "worker.py"]
    # ── Límite de CPU opcional (red de seguridad) ─────────────────────
    # El escaneo y el transcode pueden saturar el host en bibliotecas
    # grandes. Descomenta 'cpus' y ajusta el valor a TU hardware
    # (requiere docker compose v2 y recrear el contenedor):
    #   cpus: "4.0"   → 50% de una máquina de 8 hilos (ej. Xeon 4C/8T)
    # cpus: "4.0"
    # ── Aceleración hardware (patrón Immich) ──────────────────────────
    # Para transcode con GPU/QuickSync/VA-API descomenta estas 3 líneas y
    # elige el backend cambiando UNA SOLA línea (service:):
    #   cpu   → transcode por CPU (por defecto)
    #   nvenc → NVIDIA NVENC (añade la GPU al contenedor)
    #   vaapi → VA-API (AMD / Intel iGPU)
    #   qsv   → Intel QuickSync
    # El fichero hwaccel.transcoding.yml inyecta THRESHERR_ACCEL al worker
    # y le da acceso al dispositivo; el worker verifica el backend al
    # arrancar y cae a CPU con aviso en Health si no está disponible.
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu
    volumes:
      - ./app:/app
      - ./data:/data
#      - /mnt/:/media
      - /multimedia:/media
      - /temp:/temp
    depends_on:
      - app
    restart: unless-stopped
